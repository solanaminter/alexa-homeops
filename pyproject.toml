[project]
name = "homeops"
version = "0.1.0"
description = "HomeOps for Alexa+ — family household coordinator: Alexa+ Agent Skill backed by a self-hosted MCP server, orchestrated by a Strands agent on Amazon Bedrock."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Solana Minter" }]
dependencies = [
  "mcp>=2.0",
  "strands-agents>=1.0",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
